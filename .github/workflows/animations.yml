name: Generate Snake and Pacman animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: output-branch-deployment
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate Snake into its own directory
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/snake.svg
            snake/snake-dark.svg?palette=github-dark

      # Remove any dist directory left by Snake
      - name: Prepare Pacman directory
        run: |
          rm -rf dist
          mkdir -p dist
          chmod 777 dist

      # Setup Node.js for Pacman
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Generate Pacman
      - name: Generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Combine both animations
      - name: Prepare deployment directory
        run: |
          mkdir -p output-dist
          cp snake/snake.svg output-dist/snake.svg
          cp snake/snake-dark.svg output-dist/snake-dark.svg
          cp dist/pacman-contribution-graph.svg output-dist/pacman-contribution-graph.svg

      # Deploy everything together
      - name: Deploy animations
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: output-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
