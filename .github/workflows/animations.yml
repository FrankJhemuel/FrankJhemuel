name: Generate Snake and Pacman animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: output-branch-deployment
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate Snake in light and dark versions
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/snake.svg
            snake/snake-dark.svg?palette=github-dark

      # Prepare Pacman output directory
      - name: Prepare Pacman directory
        run: mkdir -p dist

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install Pacman generator
      - name: Install Pacman generator
        run: npm install --global pacman-contribution-graph

      # Generate light Pacman graph
      - name: Generate light Pacman graph
        run: |
          pacman-contribution-graph \
            --game pacman \
            --platform github \
            --username "${{ github.repository_owner }}" \
            --gameTheme github \
            --output dist/pacman-contribution-graph.svg

      # Generate dark Pacman graph
      - name: Generate dark Pacman graph
        run: |
          pacman-contribution-graph \
            --game pacman \
            --platform github \
            --username "${{ github.repository_owner }}" \
            --gameTheme github-dark \
            --output dist/pacman-contribution-graph-dark.svg

      # Prepare deployment directory
      - name: Prepare deployment directory
        run: |
          mkdir -p output-dist
          cp snake/snake.svg output-dist/snake.svg
          cp snake/snake-dark.svg output-dist/snake-dark.svg
          cp dist/pacman-contribution-graph.svg output-dist/pacman-contribution-graph.svg
          cp dist/pacman-contribution-graph-dark.svg output-dist/pacman-contribution-graph-dark.svg

      # Deploy all animations
      - name: Deploy animations
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: output-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
